<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 90 80">
  <title>Kitchen Rube 90 in x 80 in Measured Active Field</title>
  <desc>Phase 2 measured active-field blueprint. Coordinates are inches. Nearby overflow and no-go areas are warning context, not normal build space.</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c2f2f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24765a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f519c"/>
    </marker>
    <pattern id="caution-hatch" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" stroke="#b27a2c" stroke-width="0.25"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="90" height="80" fill="#fbfaf7" stroke="#222" stroke-width="0.25"/>
  <text x="2" y="4" font-size="2.4" font-family="sans-serif">90 in x 80 in measured active field</text>
  <text x="2" y="7" font-size="1.5" font-family="sans-serif">0,0 is the top-left of the buildable canvas; overflow notes mark nearby risk, not normal mechanism space.</text>

  <rect x="0" y="0" width="8" height="80" fill="url(#caution-hatch)" opacity="0.55"/>
  <text x="1" y="12" font-size="1.8" font-family="sans-serif" transform="rotate(-90 1 12)">door / aprons beyond left edge</text>

  <rect x="0" y="0" width="18" height="9" fill="#fff3d8" stroke="#b27a2c" stroke-width="0.15" opacity="0.85"/>
  <text x="1" y="3.8" font-size="1.5" font-family="sans-serif">top-left overflow</text>
  <text x="1" y="6.2" font-size="1.2" font-family="sans-serif">above-door area: do not rely on it</text>

  <rect x="84.5" y="0" width="5.5" height="80" fill="url(#caution-hatch)" opacity="0.5"/>
  <text x="85.3" y="17" font-size="1.6" font-family="sans-serif" transform="rotate(90 85.3 17)">pipe boundary caution</text>

  <rect x="0" y="68" width="90" height="12" fill="#f8dddd" opacity="0.55"/>
  <text x="2" y="76" font-size="1.8" font-family="sans-serif">lower caution band: outlet / baseboard / human movement</text>

  <rect x="67" y="66.5" width="12" height="10" fill="#fff" stroke="#9c2f2f" stroke-width="0.25"/>
  <circle cx="73" cy="71.5" r="2.3" fill="none" stroke="#9c2f2f" stroke-width="0.25"/>
  <text x="66.5" y="64.5" font-size="1.6" font-family="sans-serif">outlet keep-clear</text>
  <text x="66.5" y="78.5" font-size="1.1" font-family="sans-serif">do not cover; access stays obvious</text>

  <rect x="0.8" y="10" width="9.2" height="54" rx="0.8" fill="#e8eef5" stroke="#506481" stroke-width="0.18"/>
  <text x="2" y="14" font-size="1.7" font-family="sans-serif">left trigger</text>
  <text x="2" y="16.4" font-size="1.3" font-family="sans-serif">column</text>
  <circle cx="5.4" cy="25" r="1.7" fill="#fff" stroke="#506481" stroke-width="0.18"/>
  <text x="3.7" y="25.5" font-size="1.2" font-family="sans-serif">B</text>
  <circle cx="5.4" cy="37" r="1.7" fill="#fff" stroke="#506481" stroke-width="0.18"/>
  <text x="3.9" y="37.5" font-size="1.2" font-family="sans-serif">L</text>
  <circle cx="5.4" cy="49" r="1.7" fill="#fff" stroke="#506481" stroke-width="0.18"/>
  <text x="3.7" y="49.5" font-size="1.2" font-family="sans-serif">D</text>
  <text x="1.8" y="58.5" font-size="1.1" font-family="sans-serif">three triggers or</text>
  <text x="1.8" y="60.4" font-size="1.1" font-family="sans-serif">selector + launch</text>

  <rect x="12" y="10" width="53" height="54" fill="#edf7ef" stroke="#75936f" stroke-width="0.18" stroke-dasharray="1.2 0.8" opacity="0.75"/>
  <text x="16" y="15" font-size="2" font-family="sans-serif">entangled mechanism field</text>
  <text x="16" y="18" font-size="1.35" font-family="sans-serif">travel, routing, delay, force transfer, reset, and arming can share neighborhoods.</text>

  <rect x="64" y="11" width="19" height="49" rx="0.8" fill="#f5eadf" stroke="#7b5843" stroke-width="0.18"/>
  <text x="66" y="15" font-size="2" font-family="sans-serif">gong court</text>
  <text x="66" y="17.7" font-size="1.25" font-family="sans-serif">store strike energy locally</text>

  <circle cx="71" cy="25" r="3.8" fill="#fffaf0" stroke="#222" stroke-width="0.25"/>
  <text x="68.8" y="25.5" font-size="1.5" font-family="sans-serif">high</text>
  <text x="67.2" y="30.4" font-size="1.15" font-family="sans-serif">falling ball?</text>

  <circle cx="77" cy="38" r="4.7" fill="#fffaf0" stroke="#222" stroke-width="0.25"/>
  <text x="73.6" y="38.5" font-size="1.5" font-family="sans-serif">medium</text>
  <text x="72.8" y="44.1" font-size="1.15" font-family="sans-serif">pendulum?</text>

  <circle cx="71.5" cy="53" r="5.6" fill="#fffaf0" stroke="#222" stroke-width="0.25"/>
  <text x="69.8" y="53.5" font-size="1.5" font-family="sans-serif">low</text>
  <text x="67.2" y="60.3" font-size="1.15" font-family="sans-serif">gravity hammer?</text>

  <path d="M 8.6 25 C 20 14, 33 11, 45 16 S 61 20, 68 25" fill="none" stroke="#9c2f2f" stroke-width="0.45" marker-end="url(#arrow-red)"/>
  <path d="M 8.6 37 C 21 36, 30 47, 44 39 S 64 33, 73 38" fill="none" stroke="#24765a" stroke-width="0.45" marker-end="url(#arrow-green)"/>
  <path d="M 8.6 49 C 19 61, 37 57, 49 51 S 61 53, 66 53" fill="none" stroke="#2f519c" stroke-width="0.45" marker-end="url(#arrow-blue)"/>

  <text x="18" y="23.5" font-size="1.35" font-family="sans-serif" fill="#9c2f2f">breakfast provisional route: bright / high / quick</text>
  <text x="21" y="35.2" font-size="1.35" font-family="sans-serif" fill="#24765a">lunch provisional route: balanced / switchable</text>
  <text x="18" y="55.5" font-size="1.35" font-family="sans-serif" fill="#2f519c">dinner provisional route: slower / heavier / stored release</text>
  <text x="31" y="64.2" font-size="1.3" font-family="sans-serif">provisional routes only; not final tracks</text>

  <rect x="14" y="28" width="10" height="5" rx="0.7" fill="#fff" stroke="#555" stroke-width="0.12"/>
  <text x="15" y="31.1" font-size="1.1" font-family="sans-serif">shared diverter?</text>

  <rect x="31" y="21" width="12" height="5.5" rx="0.7" fill="#fff" stroke="#555" stroke-width="0.12"/>
  <text x="32" y="24.3" font-size="1.1" font-family="sans-serif">marble field</text>

  <rect x="46" y="43" width="12.5" height="5.5" rx="0.7" fill="#fff" stroke="#555" stroke-width="0.12"/>
  <text x="47" y="46.3" font-size="1.1" font-family="sans-serif">stored release</text>

  <rect x="12" y="70.2" width="14" height="6.4" fill="#ffffff" stroke="#777" stroke-width="0.12"/>
  <text x="13" y="72.5" font-size="1.1" font-family="sans-serif">depth legend</text>
  <line x1="13" y1="74.3" x2="17" y2="74.3" stroke="#75936f" stroke-width="0.5"/>
  <text x="18" y="74.8" font-size="1" font-family="sans-serif">1-5 in normal</text>
  <line x1="13" y1="76" x2="17" y2="76" stroke="#b27a2c" stroke-width="0.9"/>
  <text x="18" y="76.4" font-size="1" font-family="sans-serif">6-10 in theatrical</text>
</svg>
